[project]
name = "tech-news-search"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # バックエンド
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "pydantic-settings>=2.0",
    # 収集
    "httpx>=0.27",
    "feedparser>=6.0",
    "arxiv>=2.1",
    # RAG
    "chromadb>=0.5",
    "openai>=1.30",
    # スケジューラ
    "apscheduler>=3.10",
    # ユーティリティ
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
